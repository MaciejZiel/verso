id: io.github.maciejziel.Verso
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: verso
finish-args:
- --share=ipc
- --socket=fallback-x11
- --socket=wayland
- --device=dri
- --filesystem=home
cleanup:
